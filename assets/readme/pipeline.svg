<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">P4 data pipeline</title><desc id="desc">Six cameras produce raw RGB, depth, semantic and calibration data. Auditing creates a checked dataset. RGB plus robot proprioception feed a recognition and diffusion policy.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6z" fill="#55d6be"/></marker><style>text{font-family:Arial,sans-serif;fill:#eaf8f5}.h{font-size:25px;font-weight:bold}.s{font-size:17px;fill:#b8d8d2}.k{font-size:15px;fill:#75aa9f}</style></defs>
<rect width="1200" height="420" rx="28" fill="#102b30"/><text x="52" y="56" class="h">P4 · sensor-only learning boundary</text>
<g transform="translate(48 105)"><rect width="220" height="235" rx="18" fill="#1d454c" stroke="#55d6be"/><text x="22" y="42" class="h">6 cameras</text><text x="22" y="78" class="s">front · wrist · top</text><text x="22" y="106" class="s">left · right · tray</text><text x="22" y="163" class="k">RGB · depth · semantic</text><text x="22" y="190" class="k">calibration · timestamps</text></g>
<path d="M278 222h72" stroke="#55d6be" stroke-width="5" marker-end="url(#a)"/><g transform="translate(362 105)"><rect width="220" height="235" rx="18" fill="#1d454c" stroke="#55d6be"/><text x="22" y="42" class="h">Audit + QC</text><text x="22" y="82" class="s">frame integrity</text><text x="22" y="110" class="s">physical success gates</text><text x="22" y="170" class="k">commits · checksums</text><text x="22" y="197" class="k">episode-level split</text></g>
<path d="M592 222h72" stroke="#55d6be" stroke-width="5" marker-end="url(#a)"/><g transform="translate(676 105)"><rect width="220" height="235" rx="18" fill="#1d454c" stroke="#55d6be"/><text x="22" y="42" class="h">Export</text><text x="22" y="82" class="s">6 RGB streams</text><text x="22" y="110" class="s">robot proprioception</text><text x="22" y="170" class="k">actions</text><text x="22" y="197" class="k">labels kept separate</text></g>
<path d="M906 222h72" stroke="#55d6be" stroke-width="5" marker-end="url(#a)"/><g transform="translate(990 105)"><rect width="162" height="235" rx="18" fill="#246058" stroke="#74efd4"/><text x="18" y="42" class="h">DP</text><text x="18" y="82" class="s">RGB +</text><text x="18" y="110" class="s">proprio</text><text x="18" y="164" class="k">segmentation</text><text x="18" y="190" class="k">supervision</text></g>
</svg>
