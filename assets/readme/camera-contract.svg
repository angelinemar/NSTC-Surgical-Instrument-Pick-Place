<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">Six-camera recording contract</title><desc id="desc">Each of six cameras records RGB, depth, semantic mask and matching calibration at native 224 or 448 square pixels.</desc><style>text{font-family:Arial,sans-serif;fill:#173c43}.t{font-size:28px;font-weight:bold}.s{font-size:18px;fill:#45666c}.k{font-size:16px;font-weight:bold}</style><rect width="1200" height="440" rx="28" fill="#eef8f6"/><text x="55" y="62" class="t">All camera streams are synchronized per recorded step</text><g transform="translate(48 115)" fill="#fff" stroke="#8fc9be" stroke-width="3"><rect width="172" height="210" rx="16"/><rect x="188" width="172" height="210" rx="16"/><rect x="376" width="172" height="210" rx="16"/><rect x="564" width="172" height="210" rx="16"/><rect x="752" width="172" height="210" rx="16"/><rect x="940" width="172" height="210" rx="16"/></g><g class="t"><text x="70" y="160">FRONT</text><text x="257" y="160">WRIST</text><text x="460" y="160">TOP</text><text x="636" y="160">LEFT</text><text x="820" y="160">RIGHT</text><text x="1010" y="160">TRAY</text></g><g class="s"><text x="70" y="205">RGB · depth</text><text x="70" y="235">semantic</text><text x="70" y="265">calibration</text><text x="257" y="205">RGB · depth</text><text x="257" y="235">semantic</text><text x="257" y="265">calibration</text><text x="445" y="205">RGB · depth</text><text x="445" y="235">semantic</text><text x="445" y="265">calibration</text><text x="633" y="205">RGB · depth</text><text x="633" y="235">semantic</text><text x="633" y="265">calibration</text><text x="821" y="205">RGB · depth</text><text x="821" y="235">semantic</text><text x="821" y="265">calibration</text><text x="1009" y="205">RGB · depth</text><text x="1009" y="235">semantic</text><text x="1009" y="265">calibration</text></g><text x="55" y="385" class="k">Native 224 or 448 square | Same field of view | No raw crop | Detection retains native pixels; DP exports 224.</text></svg>
