<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc"><title id="title">Dataset readiness status</title><desc id="desc">The current baseline has 50 pick and 50 place demos and is pipeline verified but not production ready.</desc><style>text{font-family:Arial,sans-serif;fill:#173c43}.h{font-size:28px;font-weight:bold}.s{font-size:19px;fill:#45666c}.n{font-size:38px;font-weight:bold}</style><rect width="1200" height="250" rx="28" fill="#fff7e8"/><text x="55" y="60" class="h">Current checked baseline · honest readiness signal</text><g transform="translate(55 94)"><rect width="250" height="105" rx="18" fill="#e2f5ef"/><text x="20" y="43" class="n">50 + 50</text><text x="20" y="77" class="s">pick / place demos</text></g><g transform="translate(335 94)"><rect width="300" height="105" rx="18" fill="#e2f5ef"/><text x="20" y="43" class="n">40 / 10</text><text x="20" y="77" class="s">train / validation pairs</text></g><g transform="translate(665 94)"><rect width="470" height="105" rx="18" fill="#ffe0a3"/><text x="20" y="43" class="n">NOT production-ready</text><text x="20" y="77" class="s">needs held-out metrics + learned rollouts</text></g></svg>
